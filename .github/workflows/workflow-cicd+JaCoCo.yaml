name: CI/CD + CodeQL + JaCoCo # Nom du workflow

on:
  push:  # Déclenchement automatique à chaque push sur le dépôt

jobs:
  analyse-codeql:
    runs-on: ubuntu-latest  # Machine virtuelle GitHub Actions

    # Permissions nécessaires pour que CodeQL puisse publier son rapport
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      # Étape 1 : Récupérer le code du dépôt
      - name: Checkout repository
        uses: actions/checkout@v4

      # Étape 2 : Installer Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # Étape 3 : Initialiser CodeQL
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java

      # Étape 4 : Compiler le projet avec Maven (sans tests)
      - name: Build with Maven
        run: mvn -B package -DskipTests

      # Étape 5 : Analyse CodeQL
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v2

      # Exécution des tests pour générer JaCoCo
      - name: Run tests with Jacoco
        run: mvn test -Dmaven.test.failure.ignore=true

      # Upload du rapport JaCoCo
      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        with:   # <-- CORRECT
          name: jacoco-report
          path: target/site/jacoco/
