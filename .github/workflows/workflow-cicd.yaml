name: CI/CD + CodeQL   # Nom du workflow

on:
  push:                # Déclenchement automatique à chaque push sur le dépôt

jobs:
  analyse-codeql:
    runs-on: ubuntu-latest   # Machine virtuelle GitHub Actions

    # Permissions nécessaires pour que CodeQL puisse publier son rapport
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      # Étape 1 : Récupérer le code du dépôt
      - name: Checkout repository
        uses: actions/checkout@v4

      # Étape 2 : Installer Java 21 (nécessaire pour compiler ton projet Spring Boot)
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'       # Version demandée dans le TP
          distribution: 'temurin'  # Distribution recommandée par GitHub

      # Étape 3 : Initialiser CodeQL pour analyser du code Java
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java          # Langage à analyser

      # Étape 4 : Compiler le projet avec Maven
      # CodeQL a besoin d'un build pour comprendre la structure du code Java
      - name: Build with Maven
        run: mvn -B package

      # Étape 5 : Lancer l'analyse CodeQL
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v2
